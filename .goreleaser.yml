version: 2

project_name: hivebus

builds:
  - main: ./cmd/hivebus/
    binary: hivebus
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/obstalabs/hivebus/internal/cli.Version={{ .Version }}
      - -X github.com/obstalabs/hivebus/internal/cli.Commit={{ .ShortCommit }}
      - -X github.com/obstalabs/hivebus/internal/cli.BuildDate={{ .CommitDate }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - repository:
      owner: obstalabs
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/obstalabs/hivebus"
    description: "Secure threaded coordination bus for agents"
    license: MIT
    install: |
      bin.install "hivebus"
    test: |
      system "#{bin}/hivebus", "version"
