version: 2

project_name: hivebus

release:
  name_template: "v{{ .Version }}"

builds:
  - main: ./cmd/hivebus/
    binary: hivebus
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/obstalabs/hivebus/internal/cli.Version={{ .Version }}
      - -X github.com/obstalabs/hivebus/internal/cli.BinarySHA={{ .FullCommit }}
      - -X github.com/obstalabs/hivebus/internal/cli.BinaryBuiltAt={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - repository:
      owner: obstalabs
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/obstalabs/hivebus"
    description: "Secure threaded coordination bus for agents"
    license: MIT
    install: |
      bin.install "hivebus"
    test: |
      system "#{bin}/hivebus", "version"
